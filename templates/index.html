<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مخزن مالی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06090f;font-family:Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px 0 20px;overflow-x:hidden}
.pbar{display:flex;gap:10px;margin-bottom:8px;align-items:center}
.pline{width:28px;height:3px;border-radius:2px;cursor:pointer;opacity:.3;position:relative;transition:all .25s}
.pline.active{opacity:1;height:4px}
.pline:hover{opacity:.75}
.ptip{position:absolute;top:11px;left:50%;transform:translateX(-50%);background:#0d1a2e;border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:2px 8px;font-size:9px;color:rgba(255,255,255,.85);white-space:nowrap;opacity:0;pointer-events:none;z-index:50;transition:opacity .15s}
.pline:hover .ptip{opacity:1}
canvas{display:block;cursor:default}
#tooltip{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,22,45,0.97);border-radius:12px;padding:12px 18px;min-width:130px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.8)}
#tooltip.in-tt{border:1.5px solid rgba(80,180,255,.55)}
#tooltip.out-tt{border:1.5px solid rgba(255,100,100,.55)}
#tooltip .tt-name{font-size:13px;font-weight:700;margin-bottom:6px}
#tooltip.in-tt .tt-name{color:#7dd4e8}
#tooltip.out-tt .tt-name{color:#e88080}
#tooltip .tt-row{font-size:10px;color:rgba(255,255,255,.5);line-height:2}
#tooltip .tt-val{color:rgba(255,255,255,.9);font-weight:600}
.stats{display:flex;gap:20px;margin-top:7px}
.stat .sl{font-size:9px;color:rgba(255,255,255,.28);text-align:center}
.stat .sv{font-size:13px;font-weight:700;text-align:center}
.ci{color:#7dd4e8}.co{color:#e88080}.cb{color:#7de8b4}
.report{width:90%;max-width:480px;margin-top:8px;padding:6px 10px}
.rrow{margin-bottom:4px}
.rbar{height:3px;border-radius:2px;cursor:pointer;display:inline-block;transition:height .15s;min-width:4px;position:relative}
.rbar:hover{height:5px}
.rbar .rtip{position:absolute;top:8px;left:0;background:#0d1a2e;border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:2px 8px;font-size:9px;color:#fff;white-space:nowrap;opacity:0;pointer-events:none;z-index:50}
.rbar:hover .rtip{opacity:1}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.mbg.open{opacity:1;pointer-events:all}
.mbox{background:#0d1f3a;border:1px solid rgba(100,180,255,.2);border-radius:14px;padding:20px;width:230px;display:flex;flex-direction:column;gap:9px}
.mbox h3{color:rgba(255,255,255,.75);font-size:11px;text-align:center}
.mbox input,.mbox select{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:7px;padding:6px 9px;color:#fff;font-size:12px;font-family:Tahoma;width:100%;outline:none;text-align:right}
.mbox select option{background:#0d1f3a}
.mbox input:focus{border-color:rgba(125,212,232,.5)}
.mbtns{display:flex;gap:7px}
.mbtns button{flex:1;padding:6px;border-radius:7px;border:none;font-size:11px;cursor:pointer;font-family:Tahoma;font-weight:500}
.bok{background:#1565a0;color:#fff}.bno{background:rgba(255,255,255,.07);color:rgba(255,255,255,.5)}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#06090f;border:1px solid #7dd4e8;color:#fff;border-radius:8px;padding:6px 16px;font-size:11px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .3s;z-index:300;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="pbar">
  <div class="pline active" style="background:#7dd4e8" onclick="setPeriod('daily',this)"><div class="ptip">روزانه</div></div>
  <div class="pline" style="background:#f0c060" onclick="setPeriod('monthly',this)"><div class="ptip">ماهانه</div></div>
  <div class="pline" style="background:#b080e8" onclick="setPeriod('yearly',this)"><div class="ptip">سالانه</div></div>
</div>
<canvas id="c"></canvas>
<div id="tooltip"><div class="tt-name" id="ttName"></div><div class="tt-row">مقدار: <span class="tt-val" id="ttAmt"></span></div><div class="tt-row">دوره: <span class="tt-val" id="ttPer"></span></div><div class="tt-row">اصل: <span class="tt-val" id="ttOrig"></span></div></div>
<div class="stats">
  <div class="stat"><div class="sl">درآمد</div><div class="sv ci" id="sIn">{{ "{:,.0f}".format(majmua_amad) }}</div></div>
  <div class="stat"><div class="sl">موجودی</div><div class="sv cb" id="sBal">{{ "{:,.0f}".format(mojoudi) }}</div></div>
  <div class="stat"><div class="sl">مصرف</div><div class="sv co" id="sOut">{{ "{:,.0f}".format(majmua_masraf) }}</div></div>
</div>
<div class="report" id="report"></div>
<div class="mbg" id="mbg">
  <div class="mbox">
    <h3 id="mt"></h3>
    <input id="mn" placeholder="نام...">
    <input id="ma" type="number" placeholder="مقدار" min="0">
    <select id="mp"><option value="daily">روزانه</option><option value="monthly" selected>ماهانه</option><option value="yearly">سالانه</option></select>
    <div class="mbtns"><button class="bno" onclick="closeM()">انصراف</button><button class="bok" onclick="confirmM()">ثبت</button></div>
  </div>
</div>
<div class="toast" id="tst"></div>

<script>
const MULT={daily:1,monthly:30,yearly:365};
const PLBL={daily:'روزانه',monthly:'ماهانه',yearly:'سالانه'};
const FLOW_RATE={daily:6,monthly:3,yearly:1};
const SPLASH_COUNT={daily:6,monthly:4,yearly:2};
let vp='daily';
let pipes={
  in: {{ pipes_in|tojson }},
  out: {{ pipes_out|tojson }}
};
let mMode=null;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,TX,TY,TW,TH,TB;
const PW=16,PH=62;
let curPct={{ darsad }},targetPct={{ darsad }};
const WSEG=80;
let wY=[],wV=[];
let drops=[],splashes=[],rings=[],outDrops=[],bubbles=[];
let lastTime=0,dropTimers={};
let currentFlowRate=FLOW_RATE[vp],targetFlowRate=FLOW_RATE[vp];
let hoveredPipe=null;

function toD(a,p){return a/MULT[p];}
function vAmt(p){return Math.round(toD(p.amt,p.period)*MULT[vp]);}
function totIn(){return pipes.in.reduce((s,p)=>s+vAmt(p),0);}
function totOut(){return pipes.out.reduce((s,p)=>s+vAmt(p),0);}
function bal(){return Math.max(0,totIn()-totOut());}
function pct(){return totIn()>0?Math.min(100,Math.round(bal()/totIn()*100)):0;}
function fmt(n){return Math.round(n).toLocaleString();}

function pipeXs(count){
  if(!count)return[];
  if(count===1)return[TX+TW/2];
  const m=PW+14;
  const step=(TW-m*2)/(count-1);
  return Array.from({length:count},(_,i)=>TX+m+i*step);
}

function setPeriod(p,el){
  vp=p;
  document.querySelectorAll('.pline').forEach(l=>l.classList.remove('active'));
  el.classList.add('active');
  targetFlowRate=FLOW_RATE[vp];
  updateStats();renderReport();
}

function initCanvas(){
  W=Math.min(window.innerWidth,500);
  H=Math.round(W*0.82);
  canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(devicePixelRatio,devicePixelRatio);
  const m=Math.max(10,W*0.055);
  TX=m;TY=PH+12;TW=W-m*2;TH=Math.round(H*0.52);TB=TY+TH;
  wY=Array.from({length:WSEG+1},()=>TB-TH*curPct/100);
  wV=Array.from({length:WSEG+1},()=>0);
  dropTimers={};drops=[];outDrops=[];splashes=[];rings=[];
}

function loop(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  currentFlowRate+=(targetFlowRate-currentFlowRate)*0.04;
  targetPct=pct();
  curPct+=(targetPct-curPct)*0.04;
  const fh=TH*curPct/100;
  const waterTop=TB-fh;

  const inXs=pipeXs(pipes.in.length);
  inXs.forEach((cx,i)=>{
    const key='in'+i;
    if(!dropTimers[key])dropTimers[key]=Math.random();
    dropTimers[key]+=dt;
    const interval=1/Math.max(currentFlowRate,0.1);
    while(dropTimers[key]>=interval){
      dropTimers[key]-=interval;
      drops.push({x:cx+(Math.random()-0.5)*3,y:TY-PH+4,vy:0,r:2.5+Math.random()*1.5,isIn:true,cx});
    }
  });

  if(curPct>1){
    const outXs=pipeXs(pipes.out.length);
    outXs.forEach((cx,i)=>{
      const key='out'+i;
      if(!dropTimers[key])dropTimers[key]=Math.random()*0.5;
      dropTimers[key]+=dt;
      const outRate=Math.max(currentFlowRate*0.7,0.5);
      const interval=1/outRate;
      while(dropTimers[key]>=interval){
        dropTimers[key]-=interval;
        outDrops.push({x:cx+(Math.random()-0.5)*3,y:TB+2,vy:1.5+Math.random()*1.5,r:2+Math.random()*1.5});
      }
    });
  }

  const rest=waterTop;
  for(let i=0;i<=WSEG;i++){
    wV[i]+=(rest-wY[i])*0.035;
    if(i>0)wV[i]+=(wY[i-1]-wY[i])*0.08;
    if(i<WSEG)wV[i]+=(wY[i+1]-wY[i])*0.08;
    wV[i]*=0.92;
    wY[i]+=wV[i];
    wY[i]=Math.max(TY+2,Math.min(TB-1,wY[i]));
  }

  drops=drops.filter(d=>{
    d.vy+=0.45;d.y+=d.vy;
    const seg=Math.round((d.x-TX)/TW*WSEG);
    const si=Math.max(0,Math.min(WSEG,seg));
    const surf=wY[si];
    if(d.y>=surf){
      createSplash(d.x,surf,d.vy);
      for(let k=-3;k<=3;k++){const ki=Math.max(0,Math.min(WSEG,si+k));wV[ki]-=(4-Math.abs(k))*0.25;}
      return false;
    }
    return d.y<TB;
  });

  outDrops=outDrops.filter(d=>{d.vy+=0.3;d.y+=d.vy;return d.y<TB+PH+40;});
  splashes=splashes.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=0.25;s.life-=0.055;return s.life>0;});
  rings=rings.filter(rg=>{rg.r+=1.4;rg.life-=0.045;return rg.life>0;});

  drawFrame(fh,waterTop);
  requestAnimationFrame(loop);
}

function createSplash(x,y,impactVy){
  const n=SPLASH_COUNT[vp];
  const spd=Math.min(Math.abs(impactVy)*0.35,3.5);
  for(let i=0;i<n;i++){
    const angle=-Math.PI+Math.random()*Math.PI;
    const s=spd*(0.5+Math.random()*0.5);
    splashes.push({x,y,vx:Math.cos(angle)*s*0.8,vy:Math.sin(angle)*s-spd*0.4,life:0.8+Math.random()*0.3,r:1+Math.random()*1.2});
  }
  rings.push({x,y,r:2,life:1});
}

function drawFrame(fh,waterTop){
  ctx.clearRect(0,0,W,H);
  drawTankBg();
  if(fh>0.5)drawWater(fh,waterTop);
  drawEffects(waterTop);
  drawGlass();
  drawPipes();
  drawOutDrops();
  drawDrops();
  drawPlusBtns();
  drawPct(waterTop);
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

function drawTankBg(){
  ctx.save();rr(TX,TY,TW,TH,16);
  const bg=ctx.createLinearGradient(TX,TY,TX,TB);
  bg.addColorStop(0,'#0a1830');bg.addColorStop(1,'#040c1a');
  ctx.fillStyle=bg;ctx.fill();ctx.restore();
}

function drawWater(fh,waterTop){
  ctx.save();rr(TX,TY,TW,TH,16);ctx.clip();
  ctx.beginPath();ctx.moveTo(TX,TB);
  for(let i=0;i<=WSEG;i++)ctx.lineTo(TX+TW*i/WSEG,wY[i]);
  ctx.lineTo(TX+TW,TB);ctx.closePath();
  const wg=ctx.createLinearGradient(0,waterTop,0,TB);
  wg.addColorStop(0,'rgba(52,170,230,0.93)');
  wg.addColorStop(0.25,'rgba(24,120,200,0.96)');
  wg.addColorStop(0.7,'rgba(10,60,130,0.98)');
  wg.addColorStop(1,'rgba(5,30,80,1)');
  ctx.fillStyle=wg;ctx.fill();
  if(fh>30){
    ctx.globalAlpha=0.055;
    [0.28,0.55,0.78].forEach((f,k)=>{
      ctx.beginPath();
      ctx.ellipse(TX+TW*f,TB-fh*0.38+Math.sin(Date.now()*0.0008+k)*5,22+k*12,7+k*4,0,0,Math.PI*2);
      ctx.fillStyle='rgba(160,230,255,1)';ctx.fill();
    });
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawEffects(waterTop){
  ctx.save();rr(TX,TY,TW,TH,16);ctx.clip();
  rings.forEach(rg=>{
    ctx.save();ctx.globalAlpha=rg.life*0.45;
    ctx.strokeStyle='rgba(160,230,255,0.8)';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(rg.x,rg.y,rg.r,rg.r*0.28,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  });
  splashes.forEach(s=>{
    ctx.save();ctx.globalAlpha=s.life*0.85;
    ctx.fillStyle=`rgba(140,220,255,${s.life*0.8})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*s.life,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  ctx.restore();
}

function drawGlass(){
  ctx.save();
  rr(TX,TY,TW,TH,16);ctx.strokeStyle='rgba(160,210,255,0.18)';ctx.lineWidth=9;ctx.stroke();
  rr(TX,TY,TW,TH,16);ctx.strokeStyle='rgba(100,170,255,0.08)';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.roundRect(TX+9,TY+10,9,TH*0.36,5);
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fill();
  ctx.beginPath();ctx.roundRect(TX+9,TY+10,TW-18,18,8);
  const tg=ctx.createLinearGradient(0,TY+10,0,TY+28);
  tg.addColorStop(0,'rgba(255,255,255,0.06)');tg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=tg;ctx.fill();ctx.restore();
}

function drawPipes(){
  const inXs=pipeXs(pipes.in.length);
  inXs.forEach((cx,i)=>{
    const px=cx-PW/2;
    const isHov=hoveredPipe&&hoveredPipe.type==='in'&&hoveredPipe.idx===i;
    ctx.save();
    ctx.fillStyle='#224458';ctx.beginPath();ctx.roundRect(px-4,TY-PH-10,PW+8,11,3);ctx.fill();
    const g=ctx.createLinearGradient(px,0,px+PW,0);
    g.addColorStop(0,'#1a3d50');g.addColorStop(0.35,'#5ab8d8');g.addColorStop(0.65,'#5ab8d8');g.addColorStop(1,'#1a3d50');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(px,TY-PH,PW,PH,3);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.roundRect(px+2.5,TY-PH+4,3.5,PH-8,1.5);ctx.fill();
    const cg=ctx.createRadialGradient(cx,TY,0,cx,TY,PW);
    cg.addColorStop(0,'#5abcd8');cg.addColorStop(1,'#1a4a60');
    ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(cx,TY,PW*0.95,6,0,0,Math.PI*2);ctx.fill();
    if(isHov){
      ctx.strokeStyle='rgba(125,212,232,0.9)';ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(px-2,TY-PH-2,PW+4,PH+4,4);ctx.stroke();
      ctx.fillStyle='#c62828';ctx.beginPath();ctx.arc(px+PW+7,TY-PH+8,8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 10px Tahoma';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✕',px+PW+7,TY-PH+8);
    }
    ctx.restore();
  });

  const outXs=pipeXs(pipes.out.length);
  outXs.forEach((cx,i)=>{
    const px=cx-PW/2;
    const isHov=hoveredPipe&&hoveredPipe.type==='out'&&hoveredPipe.idx===i;
    ctx.save();
    const g=ctx.createLinearGradient(px,0,px+PW,0);
    g.addColorStop(0,'#3a1a1a');g.addColorStop(0.4,'#8a5050');g.addColorStop(0.6,'#8a5050');g.addColorStop(1,'#3a1a1a');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(px,TB,PW,PH,3);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.roundRect(px+2.5,TB+4,3.5,PH-8,1.5);ctx.fill();
    ctx.fillStyle='#6a3030';ctx.beginPath();ctx.ellipse(cx,TB,PW*0.95,6,0,0,Math.PI*2);ctx.fill();
    const vy=TB+PH+11;
    ctx.fillStyle='#2a2a2a';ctx.beginPath();ctx.arc(cx,vy,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#b03020';ctx.beginPath();ctx.arc(cx,vy,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.arc(cx-2.5,vy-3,3.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#777';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cx-13,vy);ctx.lineTo(cx+13,vy);ctx.stroke();
    if(isHov){
      ctx.strokeStyle='rgba(232,128,128,0.9)';ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(px-2,TB-2,PW+4,PH+4,4);ctx.stroke();
      ctx.fillStyle='#c62828';ctx.beginPath();ctx.arc(px+PW+7,TB+8,8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 10px Tahoma';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✕',px+PW+7,TB+8);
    }
    ctx.restore();
  });
}

function drawOutDrops(){
  outDrops.forEach(d=>{
    const pct2=Math.min(1,(d.y-TB)/(PH+20));
    ctx.save();ctx.globalAlpha=(1-pct2)*0.85;
    ctx.fillStyle='rgba(80,180,240,0.9)';
    ctx.beginPath();ctx.ellipse(d.x,d.y,d.r*0.55,d.r,0.15,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(200,240,255,0.3)';
    ctx.beginPath();ctx.ellipse(d.x-d.r*0.18,d.y-d.r*0.25,d.r*0.22,d.r*0.28,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

function drawDrops(){
  drops.forEach(d=>{
    ctx.save();ctx.fillStyle='rgba(100,200,255,0.92)';
    ctx.beginPath();ctx.ellipse(d.x,d.y,d.r*0.48,d.r,0.1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(220,245,255,0.35)';
    ctx.beginPath();ctx.ellipse(d.x-d.r*0.15,d.y-d.r*0.2,d.r*0.2,d.r*0.28,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

function drawPlusBtns(){
  const inXs=pipeXs(pipes.in.length);
  const lastX=inXs.length?Math.min(inXs[inXs.length-1]+PW+20,TX+TW-16):TX+TW-16;
  drawCircBtn(lastX,TY-PH/2,'rgba(80,180,255,0.18)','rgba(80,180,255,0.6)','#7dd4e8');
  const outXs=pipeXs(pipes.out.length);
  const firstX=outXs.length?Math.max(outXs[0]-PW-20,TX+16):TX+16;
  drawCircBtn(firstX,TB+PH/2,'rgba(255,80,80,0.18)','rgba(255,80,80,0.6)','#e88080');
}

function drawCircBtn(cx,cy,fill,stroke,tc){
  ctx.save();ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,13,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle=tc;ctx.font='bold 16px Tahoma';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('+',cx,cy+1);ctx.restore();
}

function drawPct(waterTop){
  const p=Math.round(curPct);
  const ty=Math.max(waterTop-20,TY+28);
  ctx.save();ctx.font=`bold ${Math.round(W*0.062)}px Tahoma`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=10;
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.fillText(p+'%',TX+TW/2,ty);ctx.restore();
}

function getPipeAt(mx,my){
  const inXs=pipeXs(pipes.in.length);
  for(let i=0;i<inXs.length;i++){
    const px=inXs[i]-PW/2;
    if(mx>=px-4&&mx<=px+PW+4&&my>=TY-PH-12&&my<=TY+8)return{type:'in',idx:i};
  }
  const outXs=pipeXs(pipes.out.length);
  for(let i=0;i<outXs.length;i++){
    const px=outXs[i]-PW/2;
    if(mx>=px-4&&mx<=px+PW+4&&my>=TB-8&&my<=TB+PH+26)return{type:'out',idx:i};
  }
  const inXs2=pipeXs(pipes.in.length);
  const lpx=inXs2.length?Math.min(inXs2[inXs2.length-1]+PW+20,TX+TW-16):TX+TW-16;
  if(Math.hypot(mx-lpx,my-(TY-PH/2))<14)return{type:'plusIn'};
  const outXs2=pipeXs(pipes.out.length);
  const fpx=outXs2.length?Math.max(outXs2[0]-PW-20,TX+16):TX+16;
  if(Math.hypot(mx-fpx,my-(TB+PH/2))<14)return{type:'plusOut'};
  return null;
}

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const h=getPipeAt(mx,my);
  if(h&&(h.type==='in'||h.type==='out')){
    hoveredPipe=h;canvas.style.cursor='pointer';
    const p=pipes[h.type][h.idx];
    const tt=document.getElementById('tooltip');
    tt.className='pipe-tooltip '+(h.type==='in'?'in-tt':'out-tt');
    document.getElementById('ttName').textContent=p.name;
    document.getElementById('ttAmt').textContent=fmt(vAmt(p));
    document.getElementById('ttPer').textContent=PLBL[p.period];
    document.getElementById('ttOrig').textContent=fmt(p.amt);
    tt.style.opacity=1;
  } else {
    hoveredPipe=null;canvas.style.cursor='default';
    document.getElementById('tooltip').style.opacity=0;
  }
});

canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const h=getPipeAt(mx,my);
  if(!h)return;
  if(h.type==='plusIn'){openAdd('in');return;}
  if(h.type==='plusOut'){openAdd('out');return;}
  if(h.type==='in'){
    const cx=pipeXs(pipes.in.length)[h.idx];
    const px=cx-PW/2;
    if(Math.hypot(mx-(px+PW+7),my-(TY-PH+8))<10){delP('in',h.idx);return;}
    openEntry('in',h.idx);
  } else {
    const cx=pipeXs(pipes.out.length)[h.idx];
    const px=cx-PW/2;
    if(Math.hypot(mx-(px+PW+7),my-(TB+8))<10){delP('out',h.idx);return;}
    openEntry('out',h.idx);
  }
});
canvas.addEventListener('mouseleave',()=>{hoveredPipe=null;document.getElementById('tooltip').style.opacity=0;});

function updateStats(){
  document.getElementById('sIn').textContent=fmt(totIn());
  document.getElementById('sOut').textContent=fmt(totOut());
  document.getElementById('sBal').textContent=fmt(bal());
}

function renderReport(){
  const el=document.getElementById('report');
  const maxV=Math.max(totIn(),totOut(),1);
  const maxW=(Math.min(W,500)-40)*0.82;
  let html='';
  pipes.in.forEach(p=>{const v=vAmt(p);const w=Math.max(4,Math.round(v/maxV*maxW));html+=`<div class="rrow"><div class="rbar" style="width:${w}px;background:rgba(32,120,190,0.75)"><div class="rtip">${p.name} · ${fmt(v)}</div></div></div>`;});
  pipes.out.forEach(p=>{const v=vAmt(p);const w=Math.max(4,Math.round(v/maxV*maxW));html+=`<div class="rrow"><div class="rbar" style="width:${w}px;background:rgba(140,50,50,0.75)"><div class="rtip">${p.name} · ${fmt(v)}</div></div></div>`;});
  el.innerHTML=html;
}

function submitForm(nawu,maqdar,tawzih){
  const f=document.createElement('form');
  f.method='POST';f.action='/sabt';
  [['nawu',nawu],['maqdar',maqdar],['tawzih',tawzih]].forEach(([k,v])=>{
    const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;f.appendChild(i);
  });
  document.body.appendChild(f);f.submit();
}

function openAdd(type){
  mMode='add-'+type;
  document.getElementById('mt').textContent=type==='in'?'نل جدید درآمد':'نل جدید مصرف';
  document.getElementById('mn').style.display='block';document.getElementById('mn').value='';
  document.getElementById('ma').value='';document.getElementById('mp').value='monthly';
  document.getElementById('mbg').classList.add('open');
  setTimeout(()=>document.getElementById('mn').focus(),80);
}
function openEntry(type,idx){
  mMode='entry-'+type+'-'+idx;
  document.getElementById('mt').textContent='ثبت: '+pipes[type][idx].name;
  document.getElementById('mn').style.display='none';
  document.getElementById('ma').value='';document.getElementById('mp').value=pipes[type][idx].period;
  document.getElementById('mbg').classList.add('open');
  setTimeout(()=>document.getElementById('ma').focus(),80);
}
function closeM(){document.getElementById('mbg').classList.remove('open');}
function confirmM(){
  const name=document.getElementById('mn').value.trim();
  const amt=parseFloat(document.getElementById('ma').value)||0;
  const per=document.getElementById('mp').value;
  if(mMode==='add-in'||mMode==='add-out'){
    if(!name)return;
    const type=mMode==='add-in'?'in':'out';
    submitForm(type==='in'?'amad':'masraf',0,name);
  } else if(mMode&&mMode.startsWith('entry-')){
    const[,type,idx]=mMode.split('-');if(amt<=0)return;
    submitForm(type==='in'?'amad':'masraf',amt,pipes[type][parseInt(idx)].name);
  }
  closeM();
}
function delP(type,idx){
  const n=pipes[type][idx].name;
  if(confirm('حذف "'+n+'"؟')){
    const f=document.createElement('form');
    f.method='POST';f.action='/delete_pipe';
    [['type',type],['name',n]].forEach(([k,v])=>{
      const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;f.appendChild(i);
    });
    document.body.appendChild(f);f.submit();
  }
}
function showToast(msg){
  const t=document.getElementById('tst');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
document.getElementById('mbg').addEventListener('click',e=>{if(e.target===document.getElementById('mbg'))closeM();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeM();
  if(e.key==='Enter'&&document.getElementById('mbg').classList.contains('open'))confirmM();
});
window.addEventListener('resize',()=>{drops=[];outDrops=[];splashes=[];rings=[];dropTimers={};initCanvas();updateStats();renderReport();});

initCanvas();updateStats();renderReport();
requestAnimationFrame(ts=>{lastTime=ts;requestAnimationFrame(loop);});
</script>
</body>
